<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircuitCode — practice hardware problems</title>
<meta name="theme-color" content="#080D18">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080D18'/%3E%3Cg transform='translate(16 16) scale(.82) translate(-16 -16)' fill='none' stroke='%2335D9FF' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='8' y='8' width='16' height='16' rx='2'/%3E%3Cpath d='M12 4v4M16 4v4M20 4v4M12 24v4M16 24v4M20 24v4M4 12h4M4 16h4M4 20h4M24 12h4M24 16h4M24 20h4'/%3E%3Cpath d='M13 17l2 2 4-5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Circuit Dark — core surfaces */
  --bg: #080D18; --panel: #111C2E; --panel2: #17243A; --panel3: #1B2A40;
  --line: #26354B; --line2: #33465F;
  /* text */
  --text: #E8F0FC; --muted: #A5B3C8; --faint: #75849B;
  /* brand + semantic */
  --accent: #35D9FF;      /* electric cyan: primary actions, focus, active */
  --accent2: #9B87FF;     /* signal violet: XP, achievements, stars */
  --good: #42D6A4; --bad: #FF6B78; --warn: #FFCB70; --info: #35D9FF;
  --easy: #42D6A4; --medium: #FFCB70; --hard: #FF6B78;
  --glow-c: 0 0 0 1px rgba(53,217,255,.35), 0 0 16px rgba(53,217,255,.22);
  --glow-g: 0 0 12px rgba(66,214,164,.28);
  --glow-v: 0 0 12px rgba(155,135,255,.28);
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --r-card: 16px; --r-ctl: 10px; --r-sm: 6px;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --head: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t: 180ms;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--text); font: 15px/1.6 var(--body); background-color: var(--bg); }
body {
  background-image:
    radial-gradient(ellipse at 12% -10%, rgba(53,217,255,.08), transparent 50%),
    radial-gradient(ellipse at 100% 25%, rgba(155,135,255,.07), transparent 45%),
    linear-gradient(rgba(165,179,200,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(165,179,200,.035) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px;
  background-attachment: fixed;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); background: rgba(53,217,255,.08); color: #9BE8FF; padding: 1px 6px; border-radius: 5px; font-size: .88em; border: 1px solid rgba(53,217,255,.18); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(53,217,255,.3); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; }

/* top bar: floating glass toolbar (the one place glass is used) */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: rgba(17,28,46,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(53,217,255,.55), transparent); opacity: .6; }
.brand { color: var(--text); font: 700 19px var(--head); letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
.brand:hover { text-decoration: none; }
.brand b { color: var(--accent); font-weight: 700; }
.logo { display: inline-flex; color: var(--accent); }
.logo svg { width: 26px; height: 26px; }
.tag { color: var(--faint); font: 11px var(--mono); letter-spacing: .3px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
.tag::before { content: "● "; color: var(--good); animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.top .grow { flex: 1; }
.top nav a { color: var(--muted); font: 500 13.5px var(--head); margin-left: 4px; padding: 7px 13px; border-radius: var(--r-ctl); border: 1px solid transparent; transition: all var(--t); }
.top nav a:hover { color: var(--text); text-decoration: none; background: var(--panel2); }
.top nav a.active { color: var(--accent); border-color: rgba(53,217,255,.4); background: rgba(53,217,255,.09); }
main { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }

h1 { font: 700 32px/1.2 var(--head); letter-spacing: -.3px; margin: 0 0 6px; }
h1::before { content: "// "; color: var(--accent); font-family: var(--mono); font-weight: 500; }
h2 { font: 600 13px var(--head); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 20px; }

.chip { display: inline-block; font: 600 11px var(--mono); letter-spacing: .5px; padding: 2px 10px; border-radius: 6px; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 10%, transparent); }
.chip.Easy { color: var(--easy); } .chip.Medium { color: var(--medium); } .chip.Hard { color: var(--hard); }

.banner { background: linear-gradient(135deg, rgba(53,217,255,.07), rgba(155,135,255,.05)); border: 1px solid var(--line2); border-radius: var(--r-card); padding: 20px 22px; margin-bottom: 22px; position: relative; box-shadow: var(--shadow); }
.banner::before, .card::before { content: ""; position: absolute; top: -1px; left: -1px; width: 16px; height: 16px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); border-radius: var(--r-card) 0 0 0; pointer-events: none; opacity: .8; }
.banner h2 { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--text); margin-bottom: 4px; }
.banner .x { position: absolute; top: 10px; right: 12px; padding: 2px 9px; background: transparent; border: 0; color: var(--muted); font-size: 18px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
@media (max-width: 800px) { .steps { grid-template-columns: 1fr; } }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.step .n { display: inline-flex; width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #04121A; font: 700 14px var(--mono); align-items: center; justify-content: center; margin-right: 10px; }
.step b { font: 600 15px var(--head); }
.step p { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.toolbar .grow { flex: 1; }
.fchip { border-radius: 8px; padding: 5px 16px; font: 500 13px var(--head); }
.fchip.on { background: rgba(53,217,255,.12); border-color: var(--accent); color: var(--accent); }
.progress { height: 10px; background: var(--panel); border-radius: 6px; overflow: hidden; margin: 0 0 20px; border: 1px solid var(--line); padding: 2px; }
.progress i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }

.tablewrap { overflow-x: auto; border-radius: var(--r-card); }
.list { width: 100%; border-collapse: collapse; background: rgba(17,28,46,.92); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
.list th, .list td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.list th { color: var(--faint); font: 600 11px var(--head); text-transform: uppercase; letter-spacing: 1px; background: var(--panel2); }
.list tr:last-child td { border-bottom: 0; }
.list tbody tr { cursor: pointer; transition: background var(--t), box-shadow var(--t); }
.list tbody tr:hover { background: rgba(53,217,255,.06); box-shadow: inset 3px 0 0 var(--accent); }
.list td:first-child { font-family: var(--mono); color: var(--faint); }
.list td a { color: var(--text); font-weight: 600; }
.stars { color: var(--accent2); letter-spacing: 2px; white-space: nowrap; }
.stars .off { color: #2A3A52; }
.solved { color: var(--good); }

.problem { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .problem { grid-template-columns: 1fr; } }
.card { background: rgba(17,28,46,.96); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 20px; position: relative; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.card p { margin: 0 0 10px; }
.parts-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.parts-list span { background: var(--panel2); border: 1px solid var(--line2); padding: 3px 10px; border-radius: 6px; font: 12px var(--mono); color: var(--accent); }
.subs { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
.subs td { padding: 6px 4px; border-top: 1px solid var(--line); }
.v-ok { color: var(--good); font-weight: 600; } .v-bad { color: var(--bad); font-weight: 600; }
.hints ol { margin: 0 0 10px; padding-left: 20px; }
.hints li { margin-bottom: 6px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar .grow { flex: 1; }
button { font: 500 13px var(--head); cursor: pointer; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); padding: 7px 14px; border-radius: var(--r-ctl); transition: all var(--t); }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--panel3); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--accent); color: #04121A; border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { color: #04121A; background: #5CE3FF; box-shadow: var(--glow-c); }
button.green { background: transparent; color: var(--good); border-color: var(--good); font-weight: 600; }
button.green:hover:not(:disabled) { color: #04140E; background: var(--good); border-color: var(--good); box-shadow: var(--glow-g); }
button.danger { color: var(--bad); }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); box-shadow: 0 0 12px rgba(255,107,120,.3); }
.count { color: var(--faint); font: 11px var(--mono); margin-left: 4px; }
.kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--panel2); }

svg.board { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 14px; touch-action: none; user-select: none; display: block;
  background-color: #0A1424;
  background-image: radial-gradient(rgba(165,179,200,.22) 1px, transparent 1.4px), linear-gradient(rgba(53,217,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(53,217,255,.035) 1px, transparent 1px);
  background-size: 20px 20px, 20px 20px, 20px 20px;
  box-shadow: inset 0 0 50px rgba(0,0,0,.45); }
.board .mcu { fill: #0F1E33; stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 8px rgba(53,217,255,.22)); }
.board .mcu-title { fill: var(--accent); font: 700 12px var(--mono); letter-spacing: 1px; }
.board .pinlbl { fill: var(--text); font: 11px var(--mono); }
.board .plbl { fill: var(--muted); font: 10px var(--mono); }
.board .pin { cursor: crosshair; }
.board .pin circle.dot { fill: #C8D4E8; stroke: #0A1424; stroke-width: 2; transition: all .12s; }
.board .pin circle.pinhit { fill: transparent; stroke: none; }
.board .pin:hover circle.dot { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.board .pin.pending circle.dot { fill: var(--accent); stroke: #fff; filter: drop-shadow(0 0 8px var(--accent)); }
.board .pin.target circle.dot { stroke: var(--accent); }
.board .part .body { stroke: #DCE6F7; stroke-width: 2; fill: none; }
.board .part.sel .hit { fill: rgba(53,217,255,.09); stroke: var(--accent); stroke-dasharray: 4 3; }
.board .part .hit { fill: transparent; cursor: grab; }
.board .part .name { fill: var(--accent2); font: 11px var(--mono); text-anchor: middle; }
.board .wire { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .95; filter: drop-shadow(0 0 3px currentColor); }
.board .wire-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.board g.w:hover .wire { stroke-width: 5; opacity: 1; }
.board g.w.sel .wire { stroke-width: 6; stroke-dasharray: 2 7; }
.board .preview { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }
.hint { color: var(--faint); font-size: 12px; margin-top: 6px; }

.status { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--faint); font: 12.5px/1.5 var(--mono); }
.status.info { border-left-color: var(--info); }
.status.warn { border-left-color: var(--warn); color: #FFE0A8; }
.status.ok { border-left-color: var(--good); color: #9BEBCF; }

details.ref { margin-top: 10px; font-size: 13px; color: var(--muted); }
details.ref summary { cursor: pointer; color: var(--accent); font-family: var(--mono); font-size: 12px; }
details.ref table { margin-top: 8px; border-collapse: collapse; width: 100%; }
details.ref td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
details.ref td:first-child { white-space: nowrap; }

textarea.code { width: 100%; height: 280px; resize: vertical; background: #0B1322; color: #D5E3FA; border: 1px solid var(--line); border-radius: 12px; padding: 14px; font: 14px/1.65 var(--mono); tab-size: 2; outline: none; caret-color: var(--accent); box-shadow: inset 0 0 24px rgba(0,0,0,.4); transition: border-color var(--t), box-shadow var(--t); }
textarea.code:focus { border-color: var(--accent); box-shadow: inset 0 0 24px rgba(0,0,0,.4), 0 0 0 3px rgba(53,217,255,.15); }

.verdict { font: 700 26px var(--head); letter-spacing: -.2px; margin: 0 0 4px; }
.verdict.ok { color: var(--good); } .verdict.bad { color: var(--bad); }
.explain { color: var(--muted); margin: 0 0 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 26px; margin: 10px 0 16px; }
.stat b { display: block; font: 700 24px var(--mono); color: var(--accent); }
.stat span { color: var(--faint); font: 600 10.5px var(--head); text-transform: uppercase; letter-spacing: 1px; }
.tests { list-style: none; margin: 0; padding: 0; }
.tests li { padding: 9px 0; border-top: 1px solid var(--line); }
.tests .ok { color: var(--good); } .tests .no { color: var(--bad); }
.tests small { display: block; color: var(--muted); margin-left: 22px; font-family: var(--mono); font-size: 12px; }
.warn { color: var(--warn); font-size: 13px; }
.tline { width: 100%; height: auto; margin: 6px 0 2px 22px; max-width: calc(100% - 22px); }
.tline text { fill: var(--muted); font: 10px var(--mono); }
.tline .on { fill: var(--warn); } .tline .inp { fill: var(--accent); } .tline .srv { fill: var(--accent2); }
.board .pinlbl.pwm { fill: var(--accent); }
.tline .track { fill: #0B1322; stroke: var(--line); stroke-width: .5; }

.timer { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; padding: 2px 6px 2px 10px; border: 1px solid var(--line); border-radius: 10px; background: #0B1322; font: 13px var(--mono); vertical-align: middle; }
.timer b { font-weight: 700; color: var(--muted); letter-spacing: 1px; }
.timer.live b { color: var(--accent); }
.tbtn { padding: 1px 9px; font-size: 11px; border-radius: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
.cardstat { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; border-top: 2px solid var(--accent); }
.cardstat b { display: block; font: 700 24px var(--mono); color: var(--text); }
.cardstat span { color: var(--faint); font: 600 10.5px var(--head); text-transform: uppercase; letter-spacing: 1px; }
.chip.Solved { color: var(--good); } .chip.Progress { color: var(--warn); } .chip.New { color: var(--faint); }
.list.static tbody tr { cursor: default; }
.list tr.me { background: rgba(155,135,255,.09); box-shadow: inset 3px 0 0 var(--accent2); }
.rankcell { font: 700 15px var(--mono); width: 70px; white-space: nowrap; }
.player { display: flex; align-items: center; gap: 10px; }
.activity { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13.5px; }
.activity li { padding: 7px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
.activity .when { color: var(--faint); margin-left: auto; font-family: var(--mono); font-size: 12px; }

.profilebtn { display: flex; align-items: center; gap: 8px; margin-left: 10px; padding: 3px 12px 3px 4px; border-radius: 999px; background: var(--panel2); }
.profilebtn .uname { font: 500 13px var(--head); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar, .avatar-fb { border-radius: 50%; display: inline-flex; flex: none; object-fit: cover; }
.avatar-fb { background: var(--accent2); color: #120C33; font-weight: 700; align-items: center; justify-content: center; }
.overlay { position: fixed; inset: 0; background: rgba(5,9,18,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal { background: rgba(23,36,58,.94); border: 1px solid var(--line2); border-radius: var(--r-card); padding: 22px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal h2 { font-size: 15px; color: var(--text); }
.modal label { display: block; font: 600 11px var(--head); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.modal input[type=text] { width: 100%; padding: 9px 11px; border-radius: var(--r-ctl); border: 1px solid var(--line2); background: #0B1322; color: var(--text); font: 14px var(--mono); }
.modal input[type=text]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(53,217,255,.15); }
.modal .pickrow { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
.modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
@media (max-width: 600px) { .top .tag { display: none; } .profilebtn .uname { max-width: 80px; } }

.guide h2 { margin-top: 24px; font-size: 14px; }
.guide ul { margin: 6px 0 10px; padding-left: 20px; }
.guide li { margin-bottom: 4px; }

.bgchip { position: fixed; top: 64px; right: -70px; width: min(560px, 46vw); color: var(--accent); opacity: .05; z-index: 0; pointer-events: none; transform: rotate(6deg); transform-origin: top right; }
.bgchip svg { width: 100%; height: auto; display: block; }
main, header.top { position: relative; z-index: 1; }
header.top { position: sticky; }
@media (max-width: 700px) { .bgchip { opacity: .035; right: -140px; } }
@media print { .bgchip { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.chip.NearlyImpossible { color: var(--accent2); box-shadow: var(--glow-v); }
.chip.NearlyImpossible::before { content: "☠ "; }
</style>

<script>
'use strict';
/*
 * judge.js — deterministic hardware judge (prototype)
 *
 * Pipeline:  circuit (netlist) + firmware (JS with Arduino API) + hidden tests  ->  verdict + score
 *
 * Circuit model (digital level):
 *   - wires merge pins into nets (union-find)
 *   - resistors, potentiometers, photoresistors and pressed buttons are edges between nets
 *   - 5V, driven-HIGH pins (incl. PWM), powered sensor/chip outputs that are HIGH are "H" sources;
 *     GND, driven-LOW pins and powered outputs that are LOW are "L" sources
 *   - an LED / buzzer / RGB channel / display segment is ON when its anode is reachable from H
 *     and its cathode from L; it BURNS if both sides are reachable with no resistor in the path
 *   - H and L meeting through zero resistance is a SHORT
 *
 * Analog model (analogRead, and digitalRead of a resistor divider):
 *   - every fixed resistor is 10 kΩ, a potentiometer is 10 kΩ end to end, a photoresistor goes
 *     from ~1 kΩ (bright) to ~100 kΩ (dark), INPUT_PULLUP is 35 kΩ to 5V, LEDs are ignored
 *   - node voltages are found with a small nodal-analysis solve
 *
 * Test inputs:
 *   input   : button timeline used by every button without its own (back-compatible)
 *   inputs  : { BTN2: spec, PIR1: spec, ... } per-part timelines (PIR: windows of motion)
 *   analog  : { POT1: [[t, 0..1], ...], LDR1: [[t, 0..1 light level], ...] } step functions
 *
 * This file runs in the browser (inside a Web Worker built from toString()) and in Node (tests).
 * Keep judge() and pressedAt() self-contained: they are stringified into the worker.
 */

// ---- input model: when is a button pressed at time t (ms)? ---------------------------------
// spec = { windows: [[start,end], ...], bounce: ms, seg: ms }   (bounce = contact chatter length)
function pressedAt(spec, t) {
  if (!spec) return false;
  var windows = spec.windows || [], bounce = spec.bounce || 0, seg = spec.seg || 2;
  for (var i = 0; i < windows.length; i++) {
    var s = windows[i][0], e = windows[i][1];
    if (t >= s && t < e + bounce) {
      if (t < s + bounce) return Math.floor((t - s) / seg) % 2 === 0;   // press chatter
      if (t < e) return true;                                          // steady press
      return Math.floor((t - e) / seg) % 2 === 0;                      // release chatter
    }
  }
  return false;
}

function scoreFor(used, ref) {
  if (used <= 0) return 0;
  return Math.min(100, Math.round((ref / used) * 100));
}
function ratingFor(score) { return score >= 100 ? 3 : score >= 70 ? 2 : 1; }

// ---- the judge ------------------------------------------------------------------------------
function judge(job) {
  var circuit = job.circuit || { parts: [], wires: [] };
  var code = job.code || '';
  var tests = job.tests || [];
  var limits = job.limits || {};
  var parts = circuit.parts || [], wires = circuit.wires || [];

  var res = { verdict: 'Accepted', issues: [], warnings: [], tests: [], used: parts.length };

  // 1. component limits -----------------------------------------------------------------------
  var counts = {};
  parts.forEach(function (p) { counts[p.type] = (counts[p.type] || 0) + 1; });
  Object.keys(counts).forEach(function (type) {
    var allowed = limits[type] || 0;
    if (counts[type] > allowed) {
      res.verdict = 'Invalid Circuit';
      res.issues.push('Too many ' + type + ': ' + counts[type] + ' used, ' + allowed + ' allowed');
    }
  });
  if (res.verdict !== 'Accepted') return res;

  // 2. netlist --------------------------------------------------------------------------------
  var parent = {};
  function find(k) {
    if (parent[k] === undefined) parent[k] = k;
    while (parent[k] !== k) { parent[k] = parent[parent[k]]; k = parent[k]; }
    return k;
  }
  wires.forEach(function (w) { parent[find(w[0])] = find(w[1]); });

  var PINS = {
    LED: ['A', 'K'], BUZ: ['A', 'K'], RES: ['1', '2'], BTN: ['1', '2'],
    RGB: ['R', 'G', 'B', 'K'], SEG: ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'K'],
    POT: ['1', 'W', '2'], LDR: ['1', '2'], PIR: ['V', 'O', 'G'], SRV: ['S', 'V', 'G'],
    SR: ['DS', 'SH', 'ST', 'VCC', 'GND', 'Q0', 'Q1', 'Q2', 'Q3', 'Q4', 'Q5', 'Q6', 'Q7']
  };
  var OPTIONAL = { RGB: 'RGB', SEG: 'abcdefg', SR: 'Q' };
  var wired = {};
  wires.forEach(function (w) { wired[w[0]] = 1; wired[w[1]] = 1; });
  parts.forEach(function (p) {
    (PINS[p.type] || []).forEach(function (pn) {
      var opt = OPTIONAL[p.type] && OPTIONAL[p.type].indexOf(pn.charAt(0)) >= 0 && pn !== 'GND';
      if (!opt && !wired[p.id + '.' + pn]) res.warnings.push(p.id + ' pin ' + pn + ' is not connected');
    });
  });

  var rail5 = find('mcu.5V'), railG = find('mcu.GND');
  function powered(p, v, g) { return find(p.id + '.' + v) === rail5 && find(p.id + '.' + g) === railG; }

  var loads = [], staticEdges = [], btns = [], pots = [], ldrs = [], resistors = [], pirs = [], srvs = [], srs = [];
  parts.forEach(function (p) {
    var f = function (pn) { return find(p.id + '.' + pn); };
    switch (p.type) {
      case 'LED': case 'BUZ': loads.push({ id: p.id, a: f('A'), k: f('K') }); break;
      case 'RGB': ['R', 'G', 'B'].forEach(function (c) { loads.push({ id: p.id + '.' + c, a: f(c), k: f('K') }); }); break;
      case 'SEG': 'abcdefg'.split('').forEach(function (c) { loads.push({ id: p.id + '.' + c, a: f(c), k: f('K') }); }); break;
      case 'RES': resistors.push({ a: f('1'), b: f('2') }); staticEdges.push({ a: f('1'), b: f('2'), r: true }); break;
      case 'BTN': btns.push({ id: p.id, a: f('1'), b: f('2') }); break;
      case 'POT':
        pots.push({ id: p.id, a: f('1'), w: f('W'), b: f('2') });
        staticEdges.push({ a: f('1'), b: f('W'), r: true }, { a: f('W'), b: f('2'), r: true }); break;
      case 'LDR': ldrs.push({ id: p.id, a: f('1'), b: f('2') }); staticEdges.push({ a: f('1'), b: f('2'), r: true }); break;
      case 'PIR':
        pirs.push({ id: p.id, o: f('O'), on: powered(p, 'V', 'G') });
        if (!powered(p, 'V', 'G')) res.warnings.push(p.id + ' is not powered: wire V to 5V and G to GND');
        break;
      case 'SRV':
        srvs.push({ id: p.id, s: f('S'), on: powered(p, 'V', 'G') });
        if (!powered(p, 'V', 'G')) res.warnings.push(p.id + ' is not powered: wire V to 5V and G to GND');
        break;
      case 'SR':
        srs.push({ id: p.id, ds: f('DS'), sh: f('SH'), st: f('ST'), q: [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { return f('Q' + i); }), on: powered(p, 'VCC', 'GND') });
        if (!powered(p, 'VCC', 'GND')) res.warnings.push(p.id + ' is not powered: wire VCC to 5V and GND to GND');
        break;
    }
  });

  // reach(): which nets can a set of source nets reach, and with zero resistance (noR)?
  function reach(sources, edges) {
    var m = new Map();
    function set(n, noR) {
      var c = m.get(n);
      if (!c) { m.set(n, { noR: noR }); return true; }
      if (noR && !c.noR) { c.noR = true; return true; }
      return false;
    }
    sources.forEach(function (n) { set(n, true); });
    var changed = true;
    while (changed) {
      changed = false;
      for (var i = 0; i < edges.length; i++) {
        var e = edges[i], s;
        if ((s = m.get(e.a)) && set(e.b, e.r ? false : s.noR)) changed = true;
        if ((s = m.get(e.b)) && set(e.a, e.r ? false : s.noR)) changed = true;
      }
    }
    return m;
  }

  // step-function signal: [[t, v], ...]
  function sig(arr, tm, dflt) {
    if (!arr || !arr.length) return dflt;
    var v = dflt;
    for (var i = 0; i < arr.length; i++) { if (arr[i][0] <= tm) v = arr[i][1]; else break; }
    return v;
  }

  // 3. firmware compile -----------------------------------------------------------------------
  var API = ['pinMode', 'digitalWrite', 'digitalRead', 'analogRead', 'analogWrite', 'delay', 'millis', 'shiftOut', 'map', 'constrain', 'Servo', 'Serial',
    'HIGH', 'LOW', 'INPUT', 'OUTPUT', 'INPUT_PULLUP', 'A0', 'A1', 'MSBFIRST', 'LSBFIRST'];
  var BLOCKED = ['fetch', 'XMLHttpRequest', 'importScripts', 'postMessage', 'self', 'globalThis', 'WebSocket', 'indexedDB', 'localStorage', 'document', 'window'];
  var factory;
  try {
    factory = new Function(API.concat(BLOCKED).join(','),
      code + '\n;return { setup: typeof setup === "function" ? setup : null, loop: typeof loop === "function" ? loop : null };');
  } catch (e) {
    res.verdict = 'Compile Error';
    res.issues.push(String(e && e.message || e));
    return res;
  }

  var PWM_PINS = { 3: 1, 5: 1, 6: 1, 9: 1, 10: 1, 11: 1 };
  var SEGMAP = { 'abcdef': '0', 'bc': '1', 'abdeg': '2', 'abcdg': '3', 'bcfg': '4', 'acdfg': '5', 'acdefg': '6', 'abc': '7', 'abcdefg': '8', 'abcdfg': '9', '': ' ' };

  // 4. run every test -------------------------------------------------------------------------
  function runTest(t) {
    var check = (new Function('return (' + t.check + ')'))();
    var duration = t.duration;
    var mode = {}, val = {}, pwm = {}, usedPins = {};    // pin name -> mode / output value / PWM duty
    var servoAt = {};                                    // pin name -> angle (null = attached, not written)
    var time = 0, ops = 0, ver = 0;
    var snaps = [], reads = {}, logs = [], floating = null, error = null;
    var cache = null;
    srs.forEach(function (c) { c.shift = 0; c.latch = 0; c.psh = 0; c.pst = 0; });

    function specFor(id) { return (t.inputs && t.inputs[id]) || (id.indexOf('BTN') === 0 ? t.input : null); }
    function ik(tm) {
      var k = '';
      for (var i = 0; i < btns.length; i++) k += pressedAt(specFor(btns[i].id), tm) ? '1' : '0';
      for (var j = 0; j < pirs.length; j++) k += pressedAt(specFor(pirs[j].id), tm) ? '1' : '0';
      return k;
    }

    function sources(tm) {
      var hs = [rail5], ls = [railG], full = [rail5], pw = [];
      Object.keys(mode).forEach(function (p) {
        if (mode[p] !== 'OUTPUT') return;
        var n = find('mcu.' + p);
        if (val[p]) { hs.push(n); if (pwm[p]) pw.push({ n: n, d: pwm[p] }); else full.push(n); }
        else ls.push(n);
      });
      pirs.forEach(function (pr) { if (pr.on) { var m = pressedAt(specFor(pr.id), tm); (m ? hs : ls).push(pr.o); if (m) full.push(pr.o); } });
      srs.forEach(function (c) {
        if (!c.on) return;
        for (var i = 0; i < 8; i++) { if ((c.latch >> i) & 1) { hs.push(c.q[i]); full.push(c.q[i]); } else ls.push(c.q[i]); }
      });
      return { hs: hs, ls: ls, full: full, pw: pw };
    }

    function solve(tm) {
      var key = ver + '|' + ik(tm);
      if (cache && cache.key === key) return cache;
      var src = sources(tm), edges = staticEdges.slice();
      btns.forEach(function (b) { if (pressedAt(specFor(b.id), tm)) edges.push({ a: b.a, b: b.b, r: false }); });
      cache = { key: key, edges: edges, src: src, h: reach(src.hs, edges), l: reach(src.ls, edges), hf: null, pr: [] };
      return cache;
    }

    // brightness of a lit load: 1 if a full source feeds it, else the strongest PWM duty that does
    function levelOf(s, net) {

  var MCU_X = 150, MCU_Y0 = 62, MCU_DY = 24;
  var BOARD_W = 760, BOARD_H = 520;
  var WIRE_COLORS = ['#35D9FF', '#9B87FF', '#42D6A4', '#FFCB70', '#7FB2FF', '#5EEAD4', '#FF8F9A'];

  function partBody(type) {
    switch (type) {
      case 'LED': return '<polyline class="body" points="-28,0 -10,0"/><polygon class="body" points="-10,-12 -10,12 10,0"/><polyline class="body" points="10,-12 10,12"/><polyline class="body" points="10,0 28,0"/>' +

      case 'RES': return '<polyline class="body" points="-28,0 -16,0 -12,-8 -6,8 0,-8 6,8 12,-8 16,0 28,0"/>';
      case 'BTN': return '<polyline class="body" points="-28,0 -10,0"/><polyline class="body" points="-10,0 10,-13"/><polyline class="body" points="10,0 28,0"/><polyline class="body" points="-4,-18 4,-18" /><polyline class="body" points="0,-18 0,-10"/>';
      case 'BUZ': return '<polyline class="body" points="-28,0 -14,0"/><circle class="body" r="14" cx="0" cy="0"/><polyline class="body" points="14,0 28,0"/><text x="0" y="5" text-anchor="middle" style="fill:#E8F0FC;font:14px sans-serif">♪</text>';
      case 'LDR': return '<polyline class="body" points="-28,0 -14,0"/><circle class="body" r="14" cx="0" cy="0"/><polyline class="body" points="14,0 28,0"/>' +
        '<polyline class="body" points="-8,0 -6,-5 -3,5 0,-5 3,5 6,-5 8,0" style="stroke-width:1.5"/>' +
        '<polyline class="body" points="-14,-26 -6,-16" style="stroke:#FFCB70"/><polyline class="body" points="-9,-17 -6,-16 -6,-19" style="stroke:#FFCB70"/>' +
        '<polyline class="body" points="-4,-28 4,-18" style="stroke:#FFCB70"/><polyline class="body" points="1,-19 4,-18 4,-21" style="stroke:#FFCB70"/>';
      case 'POT': return '<polyline class="body" points="-44,0 -24,0"/><rect class="body" x="-24" y="-9" width="48" height="18" rx="2"/><polyline class="body" points="24,0 44,0"/>' +
        '<polyline class="body" points="0,32 0,12"/><polygon class="body" points="-5,15 5,15 0,9" style="fill:#DCE6F7"/>';
      case 'RGB': return '<polyline class="body" points="-44,-22 -12,-10"/><polyline class="body" points="-44,0 -18,0"/><polyline class="body" points="-44,22 -12,10"/><polyline class="body" points="18,0 44,0"/>' +
        '<circle class="body" r="18" cx="0" cy="0"/><circle r="4" cx="-6" cy="-5" style="fill:#FF6B78"/><circle r="4" cx="6" cy="-5" style="fill:#42D6A4"/><circle r="4" cx="0" cy="6" style="fill:#7FB2FF"/>';
      case 'SEG': return '<rect class="body" x="-30" y="-46" width="60" height="92" rx="4"/>' +
        '<polyline class="body" points="-48,-36 -30,-36"/><polyline class="body" points="-48,-12 -30,-12"/><polyline class="body" points="-48,12 -30,12"/><polyline class="body" points="-48,36 -30,36"/>' +
        '<polyline class="body" points="30,-36 48,-36"/><polyline class="body" points="30,-12 48,-12"/><polyline class="body" points="30,12 48,12"/><polyline class="body" points="30,36 48,36"/>' +
        '<g style="stroke:#FFCB70;stroke-width:4;stroke-linecap:round;opacity:.85"><line x1="-11" y1="-30" x2="11" y2="-30"/><line x1="15" y1="-26" x2="15" y2="-4"/><line x1="15" y1="4" x2="15" y2="26"/>' +
        '<line x1="-11" y1="30" x2="11" y2="30"/><line x1="-15" y1="4" x2="-15" y2="26"/><line x1="-15" y1="-26" x2="-15" y2="-4"/><line x1="-11" y1="0" x2="11" y2="0"/></g>';
      case 'PIR': return '<path class="body" d="M-26,8 A26,26 0 0 1 26,8 Z"/><rect class="body" x="-28" y="8" width="56" height="12" rx="2"/>' +
        '<polyline class="body" points="-22,20 -22,34"/><polyline class="body" points="0,20 0,34"/><polyline class="body" points="22,20 22,34"/>' +
        '<path class="body" d="M-14,-4 A14,14 0 0 1 14,-4" style="stroke-width:1.2;opacity:.6"/>';
      case 'SRV': return '<rect class="body" x="-34" y="-22" width="68" height="44" rx="4"/><polyline class="body" points="-50,-20 -34,-20"/><polyline class="body" points="-50,0 -34,0"/><polyline class="body" points="-50,20 -34,20"/>' +
        '<circle class="body" r="7" cx="14" cy="0"/><polyline class="body" points="14,0 14,-30" style="stroke-width:5;stroke-linecap:round"/>';
      case 'SR': var s = '<rect class="body" x="-32" y="-90" width="64" height="180" rx="4"/><path class="body" d="M-8,-90 A8,8 0 0 0 8,-90"/>' +
        '<text x="0" y="4" text-anchor="middle" style="fill:#A5B3C8;font:11px var(--mono)">595</text>';
        [-66, -44, -22, 22, 44].forEach(function (y) { s += '<polyline class="body" points="-50,' + y + ' -32,' + y + '"/>'; });
        for (var i = 0; i < 8; i++) { var y = -77 + 22 * i; s += '<polyline class="body" points="32,' + y + ' 50,' + y + '"/>'; }
        return s;
    }
    return '';
  }

  /* ---------- editor state ---------- */
  var S = null, drag = null, board = null;

  function mcuPinPos(name) { return [MCU_X, MCU_Y0 + MCU_PINS.indexOf(name) * MCU_DY]; }
  function partById(id) { return S.parts.filter(function (p) { return p.id === id; })[0]; }
  function pinPos(key) {
    var i = key.indexOf('.'), owner = key.slice(0, i), pin = key.slice(i + 1);
    if (owner === 'mcu') return mcuPinPos(pin);
    var p = partById(owner), d = PART_DEFS[p.type].pins[pin];
    return [p.x + d[0], p.y + d[1]];
  }
  function friendly(key) {
    var i = key.indexOf('.'), owner = key.slice(0, i), pin = key.slice(i + 1);
    if (owner === 'mcu') return 'Arduino ' + pin;
    var p = partById(owner);
    return owner + ' ' + (p ? (PART_DEFS[p.type].pn[pin] || pin) : pin);
  }
  // keep a part (including its pins and labels) inside the board and clear of the Arduino
  function clampPos(type, x, y) {
    var b = boxOf(type);
    return [Math.max(190 - b[0], Math.min(BOARD_W - 8 - b[0] - b[2], x)), Math.max(22 - b[1], Math.min(BOARD_H - 8 - b[1] - b[3], y))];
  }
  function countType(t) { return S.parts.filter(function (p) { return p.type === t; }).length; }
  function nextId(t) { var n = 1; while (partById(t + n)) n++; return t + n; }

  function save() { store.set('cc.p.' + S.problem.id, { parts: S.parts, wires: S.wires, code: S.code }); }

  /* undo history (circuit only) */
  function snap() {
    S.hist.push(JSON.stringify({ parts: S.parts, wires: S.wires }));
    if (S.hist.length > 50) S.hist.shift();
  }
  function undo() {
    if (!S || !S.hist.length) return;
    var o = JSON.parse(S.hist.pop());
    S.parts = o.parts; S.wires = o.wires; S.sel = null; S.selWire = null; S.pending = null;
    changed();
  }

  function statusInfo() {
    if (S.pending) return { cls: 'info', html: 'Connecting from <b>' + esc(friendly(S.pending)) + '</b>. Now click the pin you want to join it to. (<span class="kbd">Esc</span> cancels)' };
    if (S.selWire !== null) return { cls: 'info', html: 'Wire selected. Press <span class="kbd">Delete</span> or the <b>Delete</b> button to remove it.' };
    if (S.sel) return { cls: 'info', html: '<b>' + esc(S.sel) + '</b> selected. Drag it to move it, or press <span class="kbd">Delete</span> to remove it.' };
    if (!S.parts.length) return { cls: 'info', html: '<b>Step 1:</b> add the parts you need with the buttons above the board.' };
    if (!S.wires.length) return { cls: 'info', html: '<b>Step 2:</b> connect them. Click one pin, then click another pin to draw a wire.' };
    var loose = [];
    S.parts.forEach(function (p) {
      var def = PART_DEFS[p.type];
      Object.keys(def.pins).forEach(function (pn) {
        if (optionalPin(p.type, pn)) return;
        var key = p.id + '.' + pn;
        var used = S.wires.some(function (w) { return w[0] === key || w[1] === key; });
        if (!used) loose.push(friendly(key));
      });
    });
    if (loose.length) return { cls: 'warn', html: '⚠ Not connected yet: ' + loose.slice(0, 3).map(esc).join(', ') + (loose.length > 3 ? ' and ' + (loose.length - 3) + ' more' : '') + '.' };
    return { cls: 'ok', html: '✔ Every pin is connected. <b>Step 3:</b> write your firmware below and press <b>Run tests</b>.' };
  }

  function draw() {
    var s = '<rect class="mcu" x="20" y="20" width="130" height="' + (MCU_Y0 + (MCU_PINS.length - 1) * MCU_DY + 30 - 20) + '" rx="10"/>' +
      '<text class="mcu-title" x="85" y="42" text-anchor="middle">ARDUINO UNO</text>';
    MCU_PINS.forEach(function (n) {
      var xy = mcuPinPos(n), key = 'mcu.' + n;
      s += '<text class="pinlbl' + (PWM_PINS[n] ? ' pwm' : '') + '" x="' + (MCU_X - 14) + '" y="' + (xy[1] + 4) + '" text-anchor="end">' + (PWM_PINS[n] ? '~' : '') + n + '</text>' +
        '<g class="pin' + (S.pending === key ? ' pending' : '') + (S.pending && S.pending !== key ? ' target' : '') + '" data-pin="' + key + '"><title>' + n + '</title><circle class="pinhit" cx="' + xy[0] + '" cy="' + xy[1] + '" r="12"/><circle class="dot" cx="' + xy[0] + '" cy="' + xy[1] + '" r="6"/></g>';
    });
    S.wires.forEach(function (w, i) {
      var a = pinPos(w[0]), b = pinPos(w[1]), dir = b[0] >= a[0] ? 1 : -1, dx = Math.max(40, Math.abs(b[0] - a[0]) / 2);
      var d = 'M' + a[0] + ' ' + a[1] + ' C' + (a[0] + dir * dx) + ' ' + a[1] + ' ' + (b[0] - dir * dx) + ' ' + b[1] + ' ' + b[0] + ' ' + b[1];
      s += '<g class="w' + (S.selWire === i ? ' sel' : '') + '" data-wire="' + i + '"><title>Click to select this wire</title><path class="wire" stroke="' + WIRE_COLORS[i % WIRE_COLORS.length] + '" style="color:' + WIRE_COLORS[i % WIRE_COLORS.length] + '" d="' + d + '"/><path class="wire-hit" d="' + d + '"/></g>';
    });
    S.parts.forEach(function (p) {
      var def = PART_DEFS[p.type], bx = boxOf(p.type);
      s += '<g class="part' + (S.sel === p.id ? ' sel' : '') + '" transform="translate(' + p.x + ',' + p.y + ')" data-part="' + p.id + '">' +
        '<rect class="hit" x="' + bx[0] + '" y="' + bx[1] + '" width="' + bx[2] + '" height="' + bx[3] + '" rx="6"/>' + partBody(p.type) +
        '<text class="name" x="0" y="' + (bx[1] - 4) + '">' + p.id + '</text>';
      Object.keys(def.pins).forEach(function (pn) {
        var d = def.pins[pn], key = p.id + '.' + pn;
        s += '<g class="pin' + (S.pending === key ? ' pending' : '') + (S.pending && S.pending !== key ? ' target' : '') + '" data-pin="' + key + '"><title>' + esc(friendly(key)) + '</title><circle class="pinhit" cx="' + d[0] + '" cy="' + d[1] + '" r="12"/><circle class="dot" cx="' + d[0] + '" cy="' + d[1] + '" r="6"/></g>' +
          (def.lo && def.lo[pn] ? '<text class="plbl" x="' + (d[0] + def.lo[pn][0]) + '" y="' + (d[1] + def.lo[pn][1]) + '" text-anchor="' + def.lo[pn][2] + '">' + def.pl[pn] + '</text>'
            : '<text class="plbl" x="' + d[0] + '" y="' + (d[1] + 20) + '" text-anchor="middle">' + def.pl[pn] + '</text>');
      });
      s += '</g>';
    });
    s += '<path id="preview" class="preview" d=""/>';
    board.innerHTML = s;

    var used = document.getElementById('used');
    if (used) used.textContent = S.parts.length;
    var pal = document.querySelectorAll('[data-add]');
    Array.prototype.forEach.call(pal, function (b) {
      var t = b.getAttribute('data-add');
      b.disabled = countType(t) >= S.problem.limits[t];
      b.querySelector('.count').textContent = countType(t) + '/' + S.problem.limits[t];
    });
    document.getElementById('del').disabled = !S.sel && S.selWire === null;
    document.getElementById('undo').disabled = !S.hist.length;
    var st = statusInfo(), el = document.getElementById('status');
    el.className = 'status ' + st.cls; el.innerHTML = st.html;
  }
  function changed() { save(); draw(); }

  function svgPoint(e) {
    var pt = board.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(board.getScreenCTM().inverse());
  }
  function updatePreview(e) {
    var pv = document.getElementById('preview');
    if (!pv) return;
    if (!S.pending) { pv.setAttribute('d', ''); return; }
    var a = pinPos(S.pending), b = svgPoint(e);
    pv.setAttribute('d', 'M' + a[0] + ' ' + a[1] + ' L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1));
  }
  function clickPin(key) {
    S.sel = null; S.selWire = null;
    if (!S.pending) { S.pending = key; draw(); return; }
    if (S.pending === key) { S.pending = null; draw(); return; }
    var a = S.pending, dup = S.wires.some(function (w) { return (w[0] === a && w[1] === key) || (w[0] === key && w[1] === a); });
    if (!dup) { snap(); S.wires.push([a, key]); }
    S.pending = null; changed();
  }
  function deleteSel() {
    if (!S) return;
    if (S.selWire !== null) {
      snap(); S.wires.splice(S.selWire, 1); S.selWire = null; changed(); return;
    }
    if (!S.sel) return;
    var id = S.sel;
    snap();
    S.parts = S.parts.filter(function (p) { return p.id !== id; });
    S.wires = S.wires.filter(function (w) { return w[0].split('.')[0] !== id && w[1].split('.')[0] !== id; });
    S.sel = null; changed();
  }
  document.addEventListener('keydown', function (e) {
    if (!S) return;
    var inText = e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT');
    if (inText) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { deleteSel(); e.preventDefault(); }
    if (e.key === 'Escape') { S.pending = null; S.sel = null; S.selWire = null; draw(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); e.preventDefault(); }
  });

  /* ---------- running the judge ---------- */
  function runJudge(job) {
    return new Promise(function (resolve) {
      var src = 'var pressedAt=' + pressedAt.toString() + ';\nvar judge=' + judge.toString() + ';\nonmessage=function(e){postMessage(judge(e.data));};';
      var w = null, timer = null;
      try {
        w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      } catch (e) {
        // fallback (no timeout protection): run inline
        try { resolve(judge(job)); } catch (err) { resolve({ verdict: 'Runtime Error', issues: [String(err)], warnings: [], tests: [], used: job.circuit.parts.length }); }
        return;
      }
      timer = setTimeout(function () {
        w.terminate();
        resolve({ verdict: 'Time Limit Exceeded', issues: ['Your firmware ran too long without returning (infinite loop?).'], warnings: [], tests: [], used: job.circuit.parts.length });
      }, 8000);
      w.onmessage = function (e) { clearTimeout(timer); w.terminate(); resolve(e.data); };
      w.onerror = function (e) { clearTimeout(timer); w.terminate(); resolve({ verdict: 'Runtime Error', issues: [String(e.message || 'Worker error')], warnings: [], tests: [], used: job.circuit.parts.length }); };
      w.postMessage(job);
    });
  }

  // merge intervals closer than one pixel (and of the same strength) so multiplexed LEDs draw as a solid bar
  function mergeIv(iv, px) {
    var out = [];
    iv.forEach(function (x) {
      var last = out[out.length - 1];
      if (last && x[0] - last[1] < px * 1.5 && (last[2] || 1) === (x[2] || 1)) last[1] = x[1]; else out.push(x.slice());
    });
    return out;
  }
  function timelineSvg(tl) {
    var W = 516, X0 = 50, rowH = 16, rows = [], dur = tl.duration;
    (tl.inputs || []).forEach(function (r) { rows.push({ label: r.label, cls: 'inp', iv: r.iv }); });
    Object.keys(tl.leds).forEach(function (id) { rows.push({ label: id, cls: 'on', iv: tl.leds[id] }); });
    (tl.servos || []).forEach(function (r) { rows.push({ label: r.label, cls: 'srv', iv: r.iv }); });
    var h = rows.length * rowH + 16, s = '<svg class="tline" viewBox="0 0 ' + (X0 + W) + ' ' + h + '">';
    rows.forEach(function (r, i) {
      var y = i * rowH;
      s += '<text x="0" y="' + (y + 11) + '">' + esc(r.label) + '</text><rect class="track" x="' + X0 + '" y="' + (y + 1) + '" width="' + W + '" height="' + (rowH - 4) + '" rx="2"/>';
      mergeIv(r.iv, dur / W).forEach(function (iv) {
        var x = X0 + iv[0] / dur * W, w = Math.max(1, (iv[1] - iv[0]) / dur * W);
        var op = iv.length > 2 ? ' fill-opacity="' + Math.max(0.15, iv[2]).toFixed(2) + '"' : '';
        var tip = iv.length > 3 ? '<title>' + iv[3] + '°</title>' : iv.length > 2 && iv[2] < 1 ? '<title>' + Math.round(iv[2] * 100) + '%</title>' : '';
        s += '<rect class="' + r.cls + '" x="' + x.toFixed(1) + '" y="' + (y + 1) + '" width="' + w.toFixed(1) + '" height="' + (rowH - 4) + '"' + op + '>' + tip + '</rect>';
      });
    });
    var ay = rows.length * rowH + 10;
    s += '<text x="' + X0 + '" y="' + ay + '">0</text><text x="' + (X0 + W / 2) + '" y="' + ay + '" text-anchor="middle">' + (dur / 2) + 'ms</text><text x="' + (X0 + W) + '" y="' + ay + '" text-anchor="end">' + dur + 'ms</text></svg>';
    return s;
  }

  function nextProblemLink(p) {
    var i = PROBLEMS.indexOf(p), n = PROBLEMS[i + 1];
    return n ? '<a href="#/p/' + n.id + '"><b>Next problem: ' + esc(n.title) + ' →</b></a>' : '<a href="#/">Back to all problems →</a>';
  }

  function showResult(r, submit) {
    var p = S.problem, el = document.getElementById('result');
    var ok = r.verdict === 'Accepted';
    var score = ok ? scoreFor(r.used, p.ref) : 0, rating = ok ? ratingFor(score) : 0;
    var h = '<div class="verdict ' + (ok ? 'ok' : 'bad') + '">' + esc(r.verdict) + '</div>';
    h += '<p class="explain">' + esc(VERDICT_HELP[r.verdict] || '') + '</p>';
    if (!submit) h += '<div class="hint">Practice run: not saved to your submissions. Press <b>Submit</b> to record it.</div>';
    h += '<div class="stats"><div class="stat"><b>' + r.used + '</b><span>Components used</span></div>';
    if (ok) {
      h += '<div class="stat"><b>' + p.ref + '</b><span>Optimal</span></div><div class="stat"><b>' + score + '%</b><span>Score</span></div><div class="stat"><b>' + stars(rating) + '</b><span>Rating</span></div>' +
        (submit ? '<div class="stat"><b>' + fmtTime(elapsed()) + '</b><span>Time taken</span></div><div class="stat"><b>+' + pointsFor(p, score) + '</b><span>Points</span></div>' : '');
    }
    h += '</div>';
    if (ok && r.used < p.ref) h += '<p class="v-ok">You beat the reference solution — tell the problem setter!</p>';
    if (ok && r.used > p.ref) h += '<p class="hint">A solution with ' + p.ref + ' components exists. Can you remove ' + (r.used - p.ref) + '?</p>';
    if (ok) h += '<p>' + nextProblemLink(p) + '</p>';
    (r.issues || []).forEach(function (m) { h += '<p class="v-bad">' + esc(m) + '</p>'; });
    (r.warnings || []).forEach(function (m) { h += '<p class="warn">⚠ ' + esc(m) + '</p>'; });
    if (r.tests.length) {
      h += '<ul class="tests">';
      r.tests.forEach(function (t, i) {
        h += '<li><span class="' + (t.pass ? 'ok' : 'no') + '">' + (t.pass ? '✔' : '✘') + '</span> ' + (t.hidden ? 'Hidden test ' + (i + 1) : esc(t.name));
        if (!t.pass && t.message) h += '<small>' + esc(t.message) + '</small>';
        if (!t.hidden) h += timelineSvg(t.timeline);
        h += '</li>';
      });
      h += '</ul>';
      h += '<p class="hint">The timeline shows inputs in blue (button presses, motion, and knob or light level as shading), outputs in orange (LEDs, buzzer, display segments; dimmer = fainter) and servo angle in violet.</p>';
    }
    if (!ok) h += '<p class="hint">Stuck? Use the <b>Hints</b> card on the left.</p>';
    el.innerHTML = h; el.hidden = false;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (submit) {
      var subs = allSubs(), sub = { pid: p.id, user: userKey(), ts: Date.now(), verdict: r.verdict, used: r.used, score: score, time: Math.floor(elapsed()) };
      subs.unshift(sub);
      store.set('cc.subs', subs.slice(0, 300));
      if (ok) { recordBoard(sub); tPause(); }
      renderSubs();
    }
  }

  function renderSubs() {
    var el = document.getElementById('subs'), mine = mySubs().filter(function (s) { return s.pid === S.problem.id; }).slice(0, 6);
    if (!mine.length) { el.innerHTML = '<span class="hint">No submissions yet.</span>'; return; }
    el.innerHTML = '<table class="subs">' + mine.map(function (s) {
      return '<tr><td class="' + (s.verdict === 'Accepted' ? 'v-ok' : 'v-bad') + '">' + esc(s.verdict) + '</td><td>' + s.used + ' parts</td><td>' + (s.verdict === 'Accepted' ? s.score + '%' : '—') + '</td><td>' + (s.time ? fmtTime(s.time) : '—') +
        '</td><td class="hint">' + new Date(s.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</td></tr>';
    }).join('') + '</table>';
  }

  function renderHints() {
    var el = document.getElementById('hints'), hs = S.problem.hints || [];
    if (!hs.length) { el.parentNode.hidden = true; return; }
    var n = S.hintsShown, h = '';
    if (n) h += '<ol>' + hs.slice(0, n).map(function (x) { return '<li>' + md(x) + '</li>'; }).join('') + '</ol>';

    box.className = 'timer' + (S.tstart ? ' live' : '');

  /* ---------- points, board, standings ---------- */
  var BASE = { Easy: 100, Medium: 200, Hard: 300, 'Nearly Impossible': 500 };
  function pointsFor(p, score) { return Math.round((BASE[p.difficulty] || 100) * score / 100); }
  function recordBoard(sub) {
    var u = getUser(), k = userKey(u), b = store.get('cc.board', {}), e = b[k] || { solved: {} };
    e.name = u.name || u.github || 'Guest'; e.github = u.github; e.photo = u.photo;
    var cur = e.solved[sub.pid];
    if (!cur || sub.score > cur.score || (sub.score === cur.score && sub.time < cur.time)) {
      e.solved[sub.pid] = { score: sub.score, used: sub.used, time: sub.time, ts: sub.ts };
    }
    b[k] = e; store.set('cc.board', b);
  }
  function standings() {
    var b = store.get('cc.board', {}), rows = [];
    Object.keys(b).forEach(function (k) {
      var e = b[k], pts = 0, stars = 0, time = 0, n = 0;
      PROBLEMS.forEach(function (p) {
        var s = e.solved && e.solved[p.id];
        if (s) { n++; pts += pointsFor(p, s.score); stars += ratingFor(s.score); time += s.time || 0; }
      });
      if (n) rows.push({ key: k, name: e.name || 'Guest', github: e.github, photo: e.photo, solved: n, points: pts, stars: stars, time: time });
    });
    rows.sort(function (a, c) { return c.points - a.points || a.time - c.time || a.name.localeCompare(c.name); });
    var rank = 0, prev = null;
    rows.forEach(function (r, i) {

  function migrateUser(oldK, newK, nu) {
    var subs = allSubs(), b = store.get('cc.board', {});
    var taken = !!b[newK] || subs.some(function (s) { return (s.user || 'guest') === newK; });
    if (!taken && oldK !== newK) {
      subs.forEach(function (s) { if ((s.user || 'guest') === oldK) s.user = newK; });
      store.set('cc.subs', subs);
      if (b[oldK]) { b[newK] = b[oldK]; delete b[oldK]; }
      PROBLEMS.forEach(function (p) {
        var v = store.get('cc.t.' + oldK + '.' + p.id, null);
        if (v !== null) { store.set('cc.t.' + newK + '.' + p.id, v); try { localStorage.removeItem('cc.t.' + oldK + '.' + p.id); } catch (e) {} }
      });
    }
    if (b[newK]) { b[newK].name = nu.name || nu.github || 'Guest'; b[newK].github = nu.github; b[newK].photo = nu.photo; }

    delete b[k]; store.set('cc.board', b);

  }

  /* ---------- progress & leaderboard pages ---------- */
  function renderProgress() {
    S = null;
    var u = getUser(), k = userKey(u), subs = mySubs();
    var solved = 0, stars = 0, pts = 0, scoreSum = 0, spent = 0;
    var rows = PROBLEMS.map(function (p) {
      var b = bestFor(p.id), att = subs.filter(function (s) { return s.pid === p.id; }).length, t = store.get('cc.t.' + k + '.' + p.id, 0);
      spent += t;
      if (b) { solved++; stars += ratingFor(b.score); pts += pointsFor(p, b.score); scoreSum += b.score; }
      return { p: p, b: b, att: att, t: t };
    });
    var okCount = subs.filter(function (s) { return s.verdict === 'Accepted'; }).length;
    var acc = subs.length ? Math.round(okCount / subs.length * 100) : 0;
    var pct = Math.round(solved / PROBLEMS.length * 100);
    var st = standings(), me = st.filter(function (r) { return r.key === k; })[0];
    var shown = u.name || (u.github ? '@' + u.github : 'Guest');
    var h = '<div class="card"><div class="player" style="gap:14px">' + avatarHtml(u, 56) + '<div><h1 style="margin:0">' + esc(shown) + '</h1><div class="sub" style="margin:0">' +
      (me ? 'Rank <b>#' + me.rank + '</b> of ' + st.length + ' on the <a href="#/leaderboard">leaderboard</a>' : 'Solve a problem to appear on the <a href="#/leaderboard">leaderboard</a>') + '</div></div></div>';
    if (!u.name && !u.github) h += '<p class="hint">You are playing as Guest. Click your name at the top right to set a username and photo.</p>';
    h += '<div class="cards">' + [
      [solved + ' / ' + PROBLEMS.length, 'Problems solved'], [pts, 'Points'], [stars + ' / ' + (PROBLEMS.length * 3), 'Stars'],
      [solved ? Math.round(scoreSum / solved) + '%' : '—', 'Average score'], [spent ? fmtTime(spent) : '—', 'Time spent'], [subs.length ? acc + '%' : '—', 'Submission accuracy']
    ].map(function (c) { return '<div class="cardstat"><b>' + c[0] + '</b><span>' + c[1] + '</span></div>'; }).join('') + '</div>' +
      '<div class="progress" title="' + pct + '% solved"><i style="width:' + pct + '%"></i></div>' +
      '<div class="tablewrap"><table class="list static"><thead><tr><th>#</th><th>Problem</th><th>Difficulty</th><th>Status</th><th>Attempts</th><th>Best result</th><th>Best time</th><th>Time spent</th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var status = r.b ? ['Solved', 'Solved'] : (r.att || r.t) ? ['Progress', 'In progress'] : ['New', 'Not started'];
      h += '<tr><td>' + (i + 1) + '</td><td><a href="#/p/' + r.p.id + '">' + esc(r.p.title) + '</a></td><td><span class="chip ' + dcls(r.p.difficulty) + '">' + r.p.difficulty + '</span></td>' +
        '<td><span class="chip ' + status[0] + '">' + status[1] + '</span></td><td>' + r.att + '</td>' +
        '<td>' + (r.b ? r.b.used + ' parts · ' + r.b.score + '% ' + stars_(r.b.score) : '—') + '</td><td>' + (r.b && r.b.time ? fmtTime(r.b.time) : '—') + '</td><td>' + (r.t ? fmtTime(r.t) : '—') + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
    var recent = subs.slice(0, 8);
    h += '<div class="card"><h2>Recent activity</h2>';
    if (!recent.length) h += '<span class="hint">No submissions yet. <a href="#/">Pick a problem</a> to get started.</span>';
    else {
      h += '<ul class="activity">' + recent.map(function (s) {
        var p = PROBLEMS.filter(function (x) { return x.id === s.pid; })[0];
        return '<li><span class="' + (s.verdict === 'Accepted' ? 'v-ok' : 'v-bad') + '">' + esc(s.verdict) + '</span><span>' + esc(p ? p.title : s.pid) + '</span>' +
          (s.time ? '<span class="hint" style="margin:0">' + fmtTime(s.time) + '</span>' : '') +
          '<span class="when">' + new Date(s.ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</span></li>';
      }).join('') + '</ul>';
    }
    h += '</div><p style="margin-top:16px"><button class="danger" id="resetmine">Reset my progress</button></p>';
    app.innerHTML = h;
    wireAvatars(app);
    document.getElementById('resetmine').addEventListener('click', function () {
      if (!confirm('Delete all your submissions, times and leaderboard entry? This cannot be undone.')) return;
      resetMine(); renderProgress();
    });
  }
  function stars_(score) { return stars(ratingFor(score)); }

  function renderLeaderboard() {
    S = null;
    var rows = standings(), k = userKey(), u = getUser(), me = rows.filter(function (r) { return r.key === k; })[0];
    var h = '<h1>Leaderboard</h1><p class="sub">Ranked by points. Each solved problem earns its difficulty value (Easy 100, Medium 200, Hard 300, Nearly Impossible 500) × your score %. Ties go to the player with less total time.</p>';
    if (me) h += '<div class="banner" style="padding:12px 16px">Your rank: <b>#' + me.rank + '</b> of ' + rows.length + ' · ' + me.points + ' points</div>';
    else h += '<div class="banner" style="padding:12px 16px">You are not ranked yet. <a href="#/">Solve a problem</a> and press Submit to join the board.' +
      ((u.name || u.github) ? '' : ' Set your name at the top right first so others can recognise you.') + '</div>';
    h += '<div class="tablewrap"><table class="list static"><thead><tr><th>Rank</th><th>Player</th><th>Solved</th><th>Points</th><th>Stars</th><th>Total time</th></tr></thead><tbody>';
    var medals = ['🥇', '🥈', '🥉'];
    rows.forEach(function (r) {
      h += '<tr' + (r.key === k ? ' class="me"' : '') + '><td class="rankcell">' + (r.rank <= 3 ? medals[r.rank - 1] + ' ' : '') + '#' + r.rank + '</td>' +
        '<td><div class="player">' + avatarHtml({ name: r.name, github: r.github, photo: r.photo }, 28) + '<span>' + esc(r.name) + (r.key === k ? ' <span class="hint">(you)</span>' : '') + '</span></div></td>' +
        '<td>' + r.solved + ' / ' + PROBLEMS.length + '</td><td><b>' + r.points + '</b></td><td><span class="stars">★</span> ' + r.stars + '</td><td>' + fmtTime(r.time) + '</td></tr>';
    });
    if (!rows.length) h += '<tr><td colspan="6" class="hint">No one is on the board yet. Be the first!</td></tr>';
    h += '</tbody></table></div><p class="hint">This leaderboard is stored in this browser, so it ranks everyone who plays on this device. A shared online ranking needs a small server.</p>';
    app.innerHTML = h;
    wireAvatars(app);
  }

  /* ---------- profile (username + photo) ---------- */
  function getUser() { return store.get('cc.user', { name: '', github: '', photo: '' }); }
  function avatarHtml(u, size) {
    var label = (u.name || u.github || '?').trim().charAt(0).toUpperCase() || '?';
    var src = u.photo || (u.github ? 'https://github.com/' + encodeURIComponent(u.github) + '.png?size=' + (size * 2) : '');
    var fb = '<span class="avatar-fb" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.45) + 'px">' + esc(label) + '</span>';
    if (!src) return fb;
    return '<img class="avatar" width="' + size + '" height="' + size + '" src="' + esc(src) + '" alt="" data-fb="' + esc(fb) + '">';
  }
  function wireAvatars(root) {
    Array.prototype.forEach.call(root.querySelectorAll('img.avatar'), function (img) {
      img.addEventListener('error', function () { img.outerHTML = img.getAttribute('data-fb'); });
    });
  }
  function renderProfile() {
    var btn = document.getElementById('profilebtn'), u = getUser();
    var shown = u.name || (u.github ? '@' + u.github : '');
    btn.innerHTML = avatarHtml(u, 28) + '<span class="uname">' + esc(shown || 'Set up profile') + '</span>';
    btn.title = u.github ? 'GitHub: @' + u.github : 'Click to set your username and photo';
    wireAvatars(btn);
  }
  function openProfile() {
    var u = getUser(), photo = u.photo;
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal" role="dialog" aria-label="Your profile"><h2>Your profile</h2>' +
      '<div class="pickrow"><span id="pv"></span><div><input type="file" id="pfile" accept="image/*" hidden><button id="ppick">Upload photo</button> <button id="pclear">Remove</button>' +
      '<div class="hint">Or leave it empty to use your GitHub photo.</div></div></div>' +
      '<label for="pname">Display name</label><input type="text" id="pname" maxlength="30" placeholder="e.g. Somya" value="' + esc(u.name) + '">' +
      '<label for="pgh">GitHub username</label><input type="text" id="pgh" maxlength="39" placeholder="e.g. somya26" value="' + esc(u.github) + '">' +
      '<div class="btns"><button id="pcancel">Cancel</button><button class="primary" id="psave">Save</button></div></div>';
    document.body.appendChild(ov);
    var pv = ov.querySelector('#pv'), pname = ov.querySelector('#pname'), pgh = ov.querySelector('#pgh');
    function preview() {
      pv.innerHTML = avatarHtml({ name: pname.value, github: pgh.value.trim().replace(/^@/, ''), photo: photo }, 64);
      wireAvatars(pv);
    }
    function close() { document.removeEventListener('keydown', onKey); ov.remove(); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    ov.addEventListener('pointerdown', function (e) { if (e.target === ov) close(); });
    pname.addEventListener('input', preview);
    pgh.addEventListener('change', preview);
    ov.querySelector('#ppick').addEventListener('click', function () { ov.querySelector('#pfile').click(); });
    ov.querySelector('#pclear').addEventListener('click', function () { photo = ''; preview(); });
    ov.querySelector('#pfile').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var c = document.createElement('canvas'), n = 128, s = Math.min(img.width, img.height);
        c.width = c.height = n;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
        photo = c.toDataURL('image/jpeg', 0.85);
        URL.revokeObjectURL(url); preview();
      };
      img.onerror = function () { URL.revokeObjectURL(url); alert('Could not read that image. Try a JPG or PNG.'); };
      img.src = url;
    });
    ov.querySelector('#pcancel').addEventListener('click', close);
    ov.querySelector('#psave').addEventListener('click', function () {
      var nu = { name: pname.value.trim(), github: pgh.value.trim().replace(/^@/, ''), photo: photo };
      var oldK = userKey(u), newK = userKey(nu);
      stopTimer();
      migrateUser(oldK, newK, nu);
      store.set('cc.user', nu);
      renderProfile(); close(); route();
    });
    preview(); pname.focus();
  }
  document.getElementById('profilebtn').addEventListener('click', openProfile);
  renderProfile();

  function route() {
    stopTimer();
    var hash = location.hash || '#/';
    var m = hash.match(/^#\/p\/(.+)$/);
    var p = m && PROBLEMS.filter(function (x) { return x.id === m[1]; })[0];
    drag = null;
    if (p) renderProblem(p);
    else if (hash === '#/help') renderHelp();
    else if (hash === '#/progress') renderProgress();
    else if (hash === '#/leaderboard') renderLeaderboard();
    else renderList();
    var here = p ? '#/' : (['#/help', '#/progress', '#/leaderboard'].indexOf(hash) >= 0 ? hash : '#/');
    Array.prototype.forEach.call(document.querySelectorAll('.top nav a'), function (a) { a.classList.toggle('active', a.getAttribute('href') === here); });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
