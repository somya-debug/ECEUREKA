<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircuitCode — practice hardware problems</title>
<style>
:root {
  --bg: #0f1419; --panel: #171d25; --panel2: #1e2631; --line: #2a3441;
  --text: #e6edf3; --muted: #8b98a8; --accent: #f5a524; --good: #3fb950; --bad: #f85149; --info: #58a6ff;
  --easy: #3fb950; --medium: #f5a524; --hard: #f85149;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--info); text-decoration: none; }
code { font-family: var(--mono); background: var(--panel2); padding: 1px 6px; border-radius: 4px; font-size: .9em; }

.top { display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.brand { color: var(--text); font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.logo { color: var(--accent); }
.tag { color: var(--muted); font-size: 12px; }
main { max-width: 1280px; margin: 0 auto; padding: 24px; }

h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 20px; }

.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
.chip.Easy { color: var(--easy); } .chip.Medium { color: var(--medium); } .chip.Hard { color: var(--hard); }

/* problem list */
.list { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list th, .list td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.list th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; background: var(--panel2); }
.list tr:last-child td { border-bottom: 0; }
.list tbody tr:hover { background: var(--panel2); }
.list td a { color: var(--text); font-weight: 600; }
.stars { color: var(--accent); letter-spacing: 2px; white-space: nowrap; }
.stars .off { color: #3a4452; }
.solved { color: var(--good); }

/* problem page */
.problem { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .problem { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.card + .card { margin-top: 16px; }
.card p { margin: 0 0 10px; }
.parts-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.parts-list span { background: var(--panel2); border: 1px solid var(--line); padding: 3px 10px; border-radius: 6px; font-size: 13px; }
.subs { width: 100%; border-collapse: collapse; font-size: 13px; }
.subs td { padding: 5px 4px; border-top: 1px solid var(--line); }
.v-ok { color: var(--good); font-weight: 600; } .v-bad { color: var(--bad); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar .grow { flex: 1; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 6px 12px; border-radius: 7px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 700; }
button.green { background: var(--good); color: #04130a; border-color: var(--good); font-weight: 700; }
button.danger { color: var(--bad); }
.count { color: var(--muted); font-size: 12px; margin-left: 4px; }

svg.board { width: 100%; height: auto; background: #0b1016; border: 1px solid var(--line); border-radius: 8px; touch-action: none; user-select: none; display: block; }
.board .mcu { fill: #0d4f4c; stroke: #17807b; stroke-width: 2; }
.board .mcu-title { fill: #9ee7e1; font: 700 12px var(--mono); }
.board .pinlbl { fill: #bfeeea; font: 11px var(--mono); }
.board .plbl { fill: var(--muted); font: 10px var(--mono); }
.board .pin circle { fill: #c9d1d9; stroke: #0b1016; stroke-width: 2; cursor: crosshair; }
.board .pin:hover circle { fill: var(--accent); }
.board .pin.pending circle { fill: var(--accent); stroke: #fff; }
.board .part .body { stroke: #c9d1d9; stroke-width: 2; fill: none; }
.board .part.sel .hit { fill: rgba(88,166,255,.12); stroke: var(--info); stroke-dasharray: 4 3; }
.board .part .hit { fill: transparent; cursor: grab; }
.board .part .name { fill: var(--muted); font: 11px var(--mono); text-anchor: middle; }
.board .wire { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .95; }
.board .wire-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.board g.w:hover .wire { stroke-width: 5; opacity: 1; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

textarea.code { width: 100%; height: 260px; resize: vertical; background: #0b1016; color: #d6e2ee; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13.5px/1.55 var(--mono); tab-size: 2; outline: none; }
textarea.code:focus { border-color: var(--info); }

/* results */
.verdict { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
.verdict.ok { color: var(--good); } .verdict.bad { color: var(--bad); }
.stats { display: flex; flex-wrap: wrap; gap: 24px; margin: 8px 0 14px; }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.tests { list-style: none; margin: 0; padding: 0; }
.tests li { padding: 8px 0; border-top: 1px solid var(--line); }
.tests .ok { color: var(--good); } .tests .no { color: var(--bad); }
.tests small { display: block; color: var(--muted); margin-left: 22px; }
.warn { color: var(--medium); font-size: 13px; }
.tline { width: 100%; height: auto; margin: 6px 0 2px 22px; max-width: calc(100% - 22px); }
.tline text { fill: var(--muted); font: 10px var(--mono); }
.tline .on { fill: var(--accent); } .tline .inp { fill: var(--info); }
.tline .track { fill: #0b1016; }

</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo">⚡</span> CircuitCode</a>
  <span class="tag">prototype · judge runs in your browser</span>
</header>
<main id="app"></main>

<script>
'use strict';
/*
 * judge.js — deterministic hardware judge (prototype)
 *
 * Pipeline:  circuit (netlist) + firmware (JS with Arduino API) + hidden tests  ->  verdict + score
 *
 * Circuit model (digital level):
 *   - wires merge pins into nets (union-find)
 *   - resistors and pressed buttons are edges between nets
 *   - 5V and driven-HIGH pins are "H" sources, GND and driven-LOW pins are "L" sources
 *   - an LED/buzzer is ON when its anode is reachable from H and its cathode from L
 *   - it BURNS if both sides are reachable with no resistor in the path
 *   - H and L meeting through zero resistance is a SHORT
 *
 * This file runs in the browser (inside a Web Worker built from toString()) and in Node (tests).
 * Keep judge() and pressedAt() self-contained: they are stringified into the worker.
 */

// ---- input model: when is the (single) button pressed at time t (ms)? ----------------------
// spec = { windows: [[start,end], ...], bounce: ms, seg: ms }   (bounce = contact chatter length)
function pressedAt(spec, t) {
  if (!spec) return false;
  var windows = spec.windows || [], bounce = spec.bounce || 0, seg = spec.seg || 2;
  for (var i = 0; i < windows.length; i++) {
    var s = windows[i][0], e = windows[i][1];
    if (t >= s && t < e + bounce) {
      if (t < s + bounce) return Math.floor((t - s) / seg) % 2 === 0;   // press chatter
      if (t < e) return true;                                          // steady press
      return Math.floor((t - e) / seg) % 2 === 0;                      // release chatter
    }
  }
  return false;
}

function scoreFor(used, ref) {
  if (used <= 0) return 0;
  return Math.min(100, Math.round((ref / used) * 100));
}
function ratingFor(score) { return score >= 100 ? 3 : score >= 70 ? 2 : 1; }

// ---- the judge ------------------------------------------------------------------------------
function judge(job) {
  var circuit = job.circuit || { parts: [], wires: [] };
  var code = job.code || '';
  var tests = job.tests || [];
  var limits = job.limits || {};
  var parts = circuit.parts || [], wires = circuit.wires || [];

  var res = { verdict: 'Accepted', issues: [], warnings: [], tests: [], used: parts.length };

  // 1. component limits -----------------------------------------------------------------------
  var counts = {};
  parts.forEach(function (p) { counts[p.type] = (counts[p.type] || 0) + 1; });
  Object.keys(counts).forEach(function (type) {
    var allowed = limits[type] || 0;
    if (counts[type] > allowed) {
      res.verdict = 'Invalid Circuit';
      res.issues.push('Too many ' + type + ': ' + counts[type] + ' used, ' + allowed + ' allowed');
    }
  });
  if (res.verdict !== 'Accepted') return res;

  // 2. netlist --------------------------------------------------------------------------------
  var parent = {};
  function find(k) {
    if (parent[k] === undefined) parent[k] = k;
    while (parent[k] !== k) { parent[k] = parent[parent[k]]; k = parent[k]; }
    return k;
  }
  wires.forEach(function (w) { parent[find(w[0])] = find(w[1]); });

  var PINS = { LED: ['A', 'K'], BUZ: ['A', 'K'], RES: ['1', '2'], BTN: ['1', '2'] };
  var wired = {};
  wires.forEach(function (w) { wired[w[0]] = 1; wired[w[1]] = 1; });
  parts.forEach(function (p) {
    (PINS[p.type] || []).forEach(function (pn) {
      if (!wired[p.id + '.' + pn]) res.warnings.push(p.id + ' pin ' + pn + ' is not connected');
    });
  });

  var loads = [], resEdges = [], btnEdges = [];
  parts.forEach(function (p) {
    if (p.type === 'LED' || p.type === 'BUZ') loads.push({ id: p.id, a: find(p.id + '.A'), k: find(p.id + '.K') });
    if (p.type === 'RES') resEdges.push({ a: find(p.id + '.1'), b: find(p.id + '.2'), r: true });
    if (p.type === 'BTN') btnEdges.push({ a: find(p.id + '.1'), b: find(p.id + '.2'), r: false });
  });

  // reach(): which nets can a set of source nets reach, and with zero resistance (noR)?
  function reach(sources, edges) {
    var m = new Map();
    function set(n, noR) {
      var c = m.get(n);
      if (!c) { m.set(n, { noR: noR }); return true; }
      if (noR && !c.noR) { c.noR = true; return true; }
      return false;
    }
    sources.forEach(function (n) { set(n, true); });
    var changed = true;
    while (changed) {
      changed = false;
      for (var i = 0; i < edges.length; i++) {
        var e = edges[i], s;
        if ((s = m.get(e.a)) && set(e.b, e.r ? false : s.noR)) changed = true;
        if ((s = m.get(e.b)) && set(e.a, e.r ? false : s.noR)) changed = true;
      }
    }
    return m;
  }

  // 3. firmware compile -----------------------------------------------------------------------
  var API = ['pinMode', 'digitalWrite', 'digitalRead', 'delay', 'millis', 'Serial', 'HIGH', 'LOW', 'INPUT', 'OUTPUT', 'INPUT_PULLUP'];
  var BLOCKED = ['fetch', 'XMLHttpRequest', 'importScripts', 'postMessage', 'self', 'globalThis', 'WebSocket', 'indexedDB', 'localStorage', 'document', 'window'];
  var factory;
  try {
    factory = new Function(API.concat(BLOCKED).join(','),
      code + '\n;return { setup: typeof setup === "function" ? setup : null, loop: typeof loop === "function" ? loop : null };');
  } catch (e) {
    res.verdict = 'Compile Error';
    res.issues.push(String(e && e.message || e));
    return res;
  }

  // 4. run every test -------------------------------------------------------------------------
  function runTest(t) {
    var check = (new Function('return (' + t.check + ')'))();
    var duration = t.duration;
    var mode = {}, val = {};            // pin name -> mode / output value
    var time = 0, ops = 0, ver = 0;
    var snaps = [], reads = {}, logs = [], floating = null, error = null;
    var cache = null;

    function solve(pressed) {
      if (cache && cache.ver === ver && cache.pressed === pressed) return cache;
      var hs = [find('mcu.5V')], ls = [find('mcu.GND')];
      Object.keys(mode).forEach(function (p) {
        if (mode[p] === 'OUTPUT') (val[p] ? hs : ls).push(find('mcu.' + p));
      });
      var edges = pressed ? resEdges.concat(btnEdges) : resEdges;
      cache = { ver: ver, pressed: pressed, h: reach(hs, edges), l: reach(ls, edges) };
      return cache;
    }

    function snapshot() {
      var s = solve(pressedAt(t.input, time));
      var leds = {}, burned = [], short = false, pins = {};
      loads.forEach(function (ld) {
        var a = s.h.get(ld.a), k = s.l.get(ld.k), on = !!(a && k);
        leds[ld.id] = on;
        if (on && a.noR && k.noR) burned.push(ld.id);
      });
      s.h.forEach(function (hv, n) { var lv = s.l.get(n); if (lv && hv.noR && lv.noR) short = true; });
      Object.keys(mode).forEach(function (p) { if (mode[p] === 'OUTPUT') pins[p] = val[p] ? 1 : 0; });
      var key = JSON.stringify([leds, burned, short, pins]);
      var last = snaps[snaps.length - 1];
      if (!last || last.key !== key) snaps.push({ t: time, leds: leds, burned: burned, short: short, pins: pins, key: key });
    }

    function advance(ms) {
      var rem = ms;
      while (rem > 0) {
        var step = Math.min(rem, 1);
        var before = pressedAt(t.input, time);
        time += step; rem -= step;
        if (pressedAt(t.input, time) !== before) snapshot();
      }
    }
    function op() { if (++ops > 1500000) throw new Error('Too many operations (infinite loop without delay()?)'); }
    function pinName(p) {
      if (typeof p !== 'number' || p < 2 || p > 13 || p % 1) throw new Error('Invalid pin ' + p + ' (use 2..13)');
      return 'D' + p;
    }

    var api = {
      pinMode: function (p, m) { op(); var n = pinName(p); mode[n] = m; if (m !== 'OUTPUT') delete val[n]; else val[n] = 0; ver++; advance(0.01); snapshot(); },
      digitalWrite: function (p, v) {
        op(); var n = pinName(p);
        if (mode[n] === 'OUTPUT') { val[n] = v ? 1 : 0; ver++; }
        advance(0.01); snapshot();
      },
      digitalRead: function (p) {
        op(); var n = pinName(p); reads[n] = 1; advance(0.01);
        if (mode[n] === 'OUTPUT') return val[n];
        var s = solve(pressedAt(t.input, time)), net = find('mcu.' + n);
        if (s.l.has(net)) return 0;
        if (s.h.has(net)) return 1;
        if (mode[n] === 'INPUT_PULLUP') return 1;
        if (!floating) floating = n;
        return 0;
      },
      delay: function (ms) { op(); advance(Math.max(0, +ms || 0)); snapshot(); },
      millis: function () { op(); advance(0.01); return Math.floor(time); },
      Serial: {
        begin: function () {},
        print: function (x) { logs.push(String(x)); },
        println: function (x) { logs.push(String(x)); }
      },
      HIGH: 1, LOW: 0, INPUT: 'INPUT', OUTPUT: 'OUTPUT', INPUT_PULLUP: 'INPUT_PULLUP'
    };

    try {
      var prog = factory.apply(null, API.map(function (k) { return api[k]; }));
      snapshot();
      if (prog.setup) prog.setup();
      var idle = 0;
      while (time < duration) {
        if (!prog.loop) { advance(duration - time); break; }
        var t0 = time;
        prog.loop();
        if (time === t0) { if (++idle >= 3) { advance(duration - time); break; } } else idle = 0;
      }
      snapshot();
    } catch (e) {
      error = String(e && e.message || e);
    }

    // helpers handed to the hidden check functions
    function at(tm) {
      var s = snaps[0];
      for (var i = 0; i < snaps.length; i++) { if (snaps[i].t <= tm) s = snaps[i]; else break; }
      return s;
    }
    var ids = loads.map(function (l) { return l.id; });
    var H = {
      ids: ids,
      on: function (id, tm) { return !!at(tm).leds[id]; },
      anyOn: function (tm) { return ids.some(function (i) { return at(tm).leds[i]; }); },
      lit: function (tm) { var l = ids.filter(function (i) { return at(tm).leds[i]; }); return l.length ? l.join('+') : 'none'; },
      count: function (tm) { return ids.filter(function (i) { return at(tm).leds[i]; }).length; },
      pin: function (p, tm) { return at(tm).pins['D' + p] || 0; },
      read: function (p) { return !!reads['D' + p]; },
      logs: logs
    };

    var pass = true, message = '', kind = '';
    if (error) {
      pass = false; message = 'Runtime error: ' + error;
      kind = /Too many operations/.test(error) ? 'Time Limit Exceeded' : 'Runtime Error';
    } else {
      var burn = snaps.filter(function (s) { return s.burned.length; })[0];
      var sh = snaps.filter(function (s) { return s.short; })[0];
      if (sh) { pass = false; kind = 'Wrong Answer'; message = 'Short circuit at t=' + Math.round(sh.t) + 'ms: a supply path reaches ground with no resistance.'; }
      else if (burn) { pass = false; kind = 'Wrong Answer'; message = burn.burned.join(', ') + ' burned out at t=' + Math.round(burn.t) + 'ms: no current-limiting resistor.'; }
      else if (floating) { pass = false; kind = 'Wrong Answer'; message = 'D' + floating.slice(1) + ' was read while floating. Add a pull-up/pull-down or use INPUT_PULLUP.'; }
      else {
        var m;
        try { m = check(H); } catch (e) { m = 'Checker error: ' + e.message; }
        if (m) { pass = false; kind = 'Wrong Answer'; message = t.hidden ? 'Failed a hidden test case.' : String(m); }
      }
    }

    // LED on-intervals for the timeline view
    var tl = {};
    ids.forEach(function (id) {
      var iv = [], start = null;
      snaps.forEach(function (s) {
        if (s.leds[id] && start === null) start = s.t;
        if (!s.leds[id] && start !== null) { iv.push([start, s.t]); start = null; }
      });
      if (start !== null) iv.push([start, duration]);
      tl[id] = iv;
    });

    return { name: t.name, hidden: !!t.hidden, pass: pass, kind: kind, message: message, timeline: { duration: duration, leds: tl, input: t.input || null } };
  }

  tests.forEach(function (t) { res.tests.push(runTest(t)); });
  var failed = res.tests.filter(function (r) { return !r.pass; })[0];
  if (failed) res.verdict = failed.kind || 'Wrong Answer';
  return res;
}

if (typeof module !== 'undefined') module.exports = { judge: judge, pressedAt: pressedAt, scoreFor: scoreFor, ratingFor: ratingFor };

;
'use strict';
/*
 * problems.js — problem bank.
 *
 * Each problem:
 *   limits : max parts of each type the student may place (LED, RES, BTN, BUZ)
 *   ref    : component count of the best-known solution (score = ref / used, capped at 100)
 *   tests  : { name, hidden, duration(ms), input(button timeline), check(H) }
 *            check() gets the helper object H from judge.js and returns null on success
 *            or a string explaining the failure. check() must be self-contained.
 *
 * In production, hidden tests and reference solutions live on the server only.
 */
var PROBLEMS = [
  {
    id: 'hello-led',
    title: 'Hello, LED',
    difficulty: 'Easy',
    ref: 2,
    limits: { LED: 1, RES: 1 },
    statement: [
      'Light an LED and keep it lit.',
      'Build the circuit with the parts provided, then write firmware that turns the LED on. **Any** digital pin (2–13) may drive it.',
      'Remember: an LED needs a current-limiting resistor, or it burns out.'
    ],
    starter: 'function setup() {\n  // configure pins here\n}\n\nfunction loop() {\n  // runs forever\n}\n',
    tests: [
      { name: 'LED is lit', duration: 1500, input: null,
        check: function (H) { var ts = [100, 700, 1400]; for (var i = 0; i < ts.length; i++) if (!H.anyOn(ts[i])) return 'The LED is off at t=' + ts[i] + 'ms.'; return null; } },
      { name: 'Stays lit', hidden: true, duration: 6000, input: null,
        check: function (H) { return H.anyOn(5900) && H.anyOn(3000) ? null : 'x'; } }
    ]
  },
  {
    id: 'blink-1hz',
    title: 'Blink at 1 Hz',
    difficulty: 'Easy',
    ref: 2,
    limits: { LED: 1, RES: 1 },
    statement: [
      'Make an LED blink: **on for 500 ms, off for 500 ms**, repeating forever.',
      'Timing is checked with a few milliseconds of tolerance.'
    ],
    starter: 'function setup() {\n  \n}\n\nfunction loop() {\n  \n}\n',
    tests: [
      { name: 'Blinks on/off', duration: 3200, input: null,
        check: function (H) {
          var exp = [[250, 1], [750, 0], [1250, 1], [1750, 0]];
          for (var i = 0; i < exp.length; i++) if (H.anyOn(exp[i][0]) !== !!exp[i][1]) return 'Expected LED ' + (exp[i][1] ? 'ON' : 'OFF') + ' at t=' + exp[i][0] + 'ms.';
          return null;
        } },
      { name: 'Timing accuracy', hidden: true, duration: 6200, input: null,
        check: function (H) {
          for (var k = 0; k < 5; k++) {
            var s = k * 1000;
            if (!H.anyOn(s + 30) || !H.anyOn(s + 470) || H.anyOn(s + 530) || H.anyOn(s + 970)) return 'x';
          }
          return null;
        } }
    ]
  },
  {
    id: 'button-light',
    title: 'Button Light',
    difficulty: 'Easy',
    ref: 3,
    limits: { LED: 1, RES: 1, BTN: 1 },
    statement: [
      'The LED must be on **only while the button is held**.',
      'Read the button from pin `2` in your firmware — a circuit that powers the LED straight through the button will not be accepted.',
      'Tip: `pinMode(2, INPUT_PULLUP)` enables the internal pull-up, so the button only needs to connect pin 2 to GND (pressed = `LOW`).'
    ],
    starter: 'function setup() {\n  \n}\n\nfunction loop() {\n  \n}\n',
    tests: [
      { name: 'Follows the button', duration: 3000, input: { windows: [[1000, 2000]] },
        check: function (H) {
          if (!H.read(2)) return 'Your firmware never reads pin 2.';
          if (H.anyOn(500)) return 'LED should be OFF before the button is pressed (t=500ms).';
          if (!H.anyOn(1500)) return 'LED should be ON while the button is held (t=1500ms).';
          if (H.anyOn(2500)) return 'LED should turn OFF after release (t=2500ms).';
          return null;
        } },
      { name: 'Short presses, fast response', hidden: true, duration: 3000,
        input: { windows: [[507, 547], [1013, 1053], [1507, 2507]] },
        check: function (H) {

    document.getElementById('subbtn').addEventListener('click', function () { run(true); });

    board.addEventListener('pointerdown', function (e) {
      var pin = e.target.closest('[data-pin]');
      if (pin) { clickPin(pin.getAttribute('data-pin')); return; }
      var wire = e.target.closest('[data-wire]');
      if (wire) { S.wires.splice(+wire.getAttribute('data-wire'), 1); S.pending = null; changed(); return; }
      var part = e.target.closest('[data-part]');
      if (part) {
        var id = part.getAttribute('data-part'), pp = partById(id), pt = svgPoint(e);
        S.sel = id; S.pending = null; drag = { id: id, dx: pt.x - pp.x, dy: pt.y - pp.y };
        try { board.setPointerCapture(e.pointerId); } catch (err) {}
        draw(); return;
      }
      S.sel = null; S.pending = null; draw();
    });
    board.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var pt = svgPoint(e), pp = partById(drag.id);
      pp.x = Math.max(210, Math.min(690, Math.round((pt.x - drag.dx) / 10) * 10));
      pp.y = Math.max(50, Math.min(410, Math.round((pt.y - drag.dy) / 10) * 10));
      draw();
    });
    board.addEventListener('pointerup', function () { if (drag) { drag = null; save(); } });

    draw(); renderSubs();
  }

  function route() {
    var m = (location.hash || '#/').match(/^#\/p\/(.+)$/);
    var p = m && PROBLEMS.filter(function (x) { return x.id === m[1]; })[0];
    if (p) renderProblem(p); else renderList();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
